# HTTPS reverse proxy in front of the document server (compose service "officier", port 8080 on the
# host). Replace docs.corp.example.kz and the certificate paths. The QMS gateway is NOT published here:
# only the portal backend calls it over the internal network.

map $http_upgrade $officier_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name docs.corp.example.kz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;  # nginx older than 1.25.1: drop this line and use "listen 443 ssl http2;"
    server_name docs.corp.example.kz;

    ssl_certificate     /etc/nginx/certs/docs.corp.example.kz.crt;
    ssl_certificate_key /etc/nginx/certs/docs.corp.example.kz.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # QMS sources are limited to 50 MB; leave room for spreadsheets and attachments.
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        # Every open editor keeps one WebSocket for real-time co-editing.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $officier_connection;
        # The document server builds absolute URLs (api.js, editor assets) from these headers.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
